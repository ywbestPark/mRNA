단백질 세 칸을 그리고 화살표로 순서를 적어 본다.", "차이 네 가지(당, 염기, 가닥, 길이)를 표로 정리한다.", "‘전사’와 ‘번역’이 각각 어느 화살표인지 표시한다."], "extra": false}, {"icon": "chat", "title": "mRNA 백신이 뭐예요?", "sub": "한 번에 설명하는 순서", "book": "책은 mRNA와 백신이 각각 무엇인지 알아야 mRNA 백신을 설명할 수 있다는 데서 출발합니다. DNA는 핵 속의 원본이고, mRNA는 그 정보를 복사해 세포질로 보내는 전령입니다. 백신은 병원체를 흉내 내어 면역을 돕는데, mRNA 백신은 병원체의 단백질 대신 그 단백질을 만들라는 지시를 넣습니다.", "mind": "mRNA 백신은 단백질을 만들라는 설계도를 넣는 백신이다.", "say": ["DNA는 원본이고 mRNA는 복사본 지시서예요. 세포가 그 지시서를 읽고 단백질을 만들어요.", "mRNA 백신은 바이러스의 단백질 대신 그 단백질을 만들라는 설계도를 넣는 백신이에요.", "그 단백질을 몸이 낯선 것으로 알아보고 항체와 기억세포를 만들어 두는 거예요."], "do": ["DNA, mRNA, 단백질 세 단어의 순서부터 말한다.", "백신이 병원체 자체인지 설계도인지 구분해서 말한다.", "친구가 되물으면 그 부분만 다시 풀어 준다."], "extra": false}, {"icon": "shield", "title": "mRNA 백신이 내 DNA를 바꾸나요?", "sub": "DNA와 mRNA를 구분하기", "book": "책이 소개하는 생물학의 중심 원리는 DNA에서 RNA, 단백질로 이어지는 정보의 흐름입니다. 책은 mRNA 백신이 DNA 백신과 달리 유전물질이 핵으로 들어가지 않으므로 숙주의 유전체에 통합될 위험이 없다고 설명합니다. mRNA는 세포질에 도착하자마자 단백질 번역을 시작합니다.", "mind": "나는 걱정을 가볍게 넘기지 않고 구조부터 확인한다.", "say": ["mRNA는 핵 안의 DNA로 들어가지 않고 세포질에서 단백질을 만드는 데 쓰인다고 책은 설명해요.", "생물의 정보는 DNA에서 RNA, 단백질 순서로 흐른다는 게 생물학의 중심 원리예요."], "do": ["DNA 백신과 mRNA 백신이 몸속에서 가는 경로를 그림으로 비교한다.", "책이 설명하는 근거(핵으로 들어가지 않음)를 한 문장으로 적는다.", "더 구체적인 의학적 질문은 선생님이나 의료진에게 묻는다."], "extra": false}, {"icon": "clock", "title": "백신이 왜 이렇게 빨리 나왔어요?", "sub": "속도의 이유 따져 보기", "book": "책은 속도가 갑자기 생긴 것이 아니라고 봅니다. 중국 과학자들이 염기서열을 공개한 지 이틀 만에 미국국립보건원과 모더나가 첫 백신 후보를 설계했고, 66일 만에 임상시험에 들어갔습니다. 그러나 이 개념이 증명되기까지는 40년에 걸친 연구가 쌓여 있었다고 책은 강조합니다.", "mind": "나는 빠름과 허술함을 구분해서 본다.", "say": ["빨랐던 건 설계 단계였고, 바탕에는 수십 년의 기초 연구가 있었다고 책은 말해요.", "임상시험도 단계를 거쳤어요. 책이 소개하는 한 임상시험에는 3만 6천 명이 넘는 참가자가 있었어요."], "do": ["속도를 설계, 전임상, 임상 단계로 나눠서 따져 본다.", "‘언제 시작했나’보다 ‘무엇이 이미 쌓여 있었나’를 본다.", "개발 일정(2일, 66일, 37일)을 타임라인으로 그려 본다."], "extra": false}, {"icon": "shield", "title": "몸은 병원체와 어떻게 싸워요?", "sub": "세 겹의 방어선", "book": "책은 면역을 세 겹으로 설명합니다. 첫째는 피부, 점액, 눈물의 효소, 위산, 공생 미생물 같은 무차별 방어선입니다. 둘째는 선천성 면역으로 식세포가 침입자를 삼키고 염증과 발열이 일어납니다. 셋째는 적응 면역으로 항체를 만드는 B세포와 T세포가 특정 침입자에 맞춰 반응합니다. 반응하는 세포가 늘어나는 데는 보통 1~2주가 걸립니다.", "mind": "면역은 무차별 방어, 빠른 대응, 맞춤 대응의 세 겹이다.", "say": ["첫 번째 방어선은 해로운 것과 아닌 것을 가리지 않고 막아요.", "항체는 세포 밖의 병원체에 효과적이고, 세포 안에 있으면 세포성 면역이 필요해요."], "do": ["세 겹 방어선을 성벽, 순찰병, 특수부대처럼 나만의 그림으로 그려 본다.", "각 방어선에 해당하는 예(피부, 식세포, B세포)를 하나씩 적는다."], "extra": false}, {"icon": "sun", "title": "열이 나는 건 왜 그래요?", "sub": "열과 염증 이해하기", "book": "책은 감염 상황에서의 열과 염증을 면역계가 작동하는 과정으로 설명합니다. 혈류가 늘면 상처 부위가 붉어지고 열이 나며, 백혈구가 늘면서 분비되는 물질이 체온을 높게 유지합니다. 체온이 오르면 세균과 곰팡이의 증식이 저해되고 식세포가 더 활발해진다고 합니다. 접종 후 반응은 이 책이 직접 다루지 않습니다.", "mind": "나는 몸의 신호를 겁내지 않고 읽는다.", "say": ["열이 나는 건 몸이 맞서는 과정의 일부일 수 있다고 책은 설명해요."], "do": ["열이 나는 과정을 ‘인터루킨 → 체온 상승 → 증식 저해’ 순서로 적어 본다.", "책의 설명은 일반 원리이며 내 증상의 진단이 아님을 기억한다.", "걱정되는 증상은 보호자나 의료진에게 알린다."], "extra": false}, {"icon": "refresh", "title": "추가 접종은 왜 필요해요?", "sub": "1차와 2차 면역반응", "book": "책은 항원을 처음 맞으면 항체를 만드는 B세포와 기억세포의 생산이 촉진되는 1차 면역반응이 일어나지만, 이 반응은 느리고 세포도 적게 생긴다고 설명합니다. 같은 항원이 다시 들어오면 이미 만들어진 기억세포가 움직여 2차 면역반응이 더 빠르고, 적은 항원으로도 더 많은 항체가 만들어집니다. 그래서 추가 접종을 하기도 합니다.", "mind": "나는 한 번의 반응보다 기억이 쌓이는 과정을 이해한다.", "say": ["처음엔 느리고 적게 반응하지만, 두 번째엔 기억세포가 먼저 움직여서 더 빨라요.", "기억세포가 제대로 자리 잡도록 돕는 게 추가 접종의 이유 중 하나라고 책은 설명해요."], "do": ["1차와 2차를 ‘느리고 적게’에서 ‘빠르고 많게’ 순서로 그래프로 그려 본다.", "내 접종 일정과 횟수는 안내문과 의료진의 설명을 기준으로 한다.", "백신마다 필요한 접종 횟수가 다를 수 있음을 기억한다."], "extra": false}, {"icon": "target", "title": "스파이크 단백질이 뭐예요?", "sub": "열쇠와 자물쇠", "book": "책은 코로나바이러스 표면의 스파이크 단백질을 열쇠, 사람 세포의 수용체를 자물쇠에 빗댑니다. 열쇠가 수용체라는 열쇠 구멍을 열고 들어가면 감염과 복제가 일어납니다. 모든 코로나바이러스에서 이 단백질이 잘 보존되어 있어 먼 공통 조상에서 진화했음을 알 수 있습니다. 연구자들은 세포와 융합하기 전의 스파이크 단백질 구조를 밝히고 이를 안정화해 효율적인 백신을 만들었습니다.", "mind": "스파이크 단백질은 바이러스가 사람 세포로 들어가는 열쇠다.", "say": ["스파이크 단백질은 열쇠고 사람 세포의 수용체는 자물쇠예요.", "그 열쇠의 모양을 정확히 알면 백신을 더 잘 설계할 수 있어요."], "do": ["열쇠와 자물쇠 그림에 ‘감염’이 일어나는 순간을 표시한다.", "구조를 밝히고 안정화한 것이 왜 중요한지 한 문장으로 쓴다."], "extra": false}, {"icon": "book", "title": "백신은 종류마다 뭐가 달라요?", "sub": "넣는 것이 무엇인지로 구분하기", "book": "책은 백신을 병원체를 약하게 만든 약독화 생백신, 병원체를 죽이거나 불활성화한 사백신, 항원 단백질을 만들어 넣는 재조합 백신, 그 단백질을 만드는 정보를 넣는 핵산 백신으로 나눕니다. 핵산 백신은 다시 DNA 백신과 mRNA 백신으로 갈립니다. 책은 핵산 백신의 큰 장점으로 개발 속도를 꼽습니다.", "mind": "나는 이름이 아니라 원리로 구분한다.", "say": ["생백신은 약하게 만든 병원체, 사백신은 죽인 병원체, 재조합은 단백질, mRNA는 단백질 설계도를 넣어요."], "do": ["‘무엇을 넣는가’를 기준으로 네 가지를 표로 정리한다.", "각 방식의 장단점은 핵심 지식의 백신 종류 항목에서 확인한다.", "누구에게 어떤 방식이 적합한지는 의료진에게 묻는다."], "extra": false}, {"icon": "bolt", "title": "mRNA 백신에는 어떤 발견이 필요했어요?", "sub": "세 줄기의 혁신", "book": "책은 코로나19 mRNA 백신에 적어도 세 줄기의 혁신이 기여했다고 봅니다. 첫째, mRNA가 선천 면역의 공격을 받지 않도록 한 mRNA 변형입니다. 둘째, 항원인 스파이크 단백질의 구조 안정화입니다. 셋째, mRNA를 세포 안으로 전달하는 지질 나노 입자의 개발입니다. 지질 나노 입자에 넣으면 노출된 mRNA보다 발현이 최대 1000배까지 향상된다고 합니다.", "mind": "mRNA 백신은 변형, 구조 안정화, 포장 기술이 모여 완성되었다.", "say": ["mRNA는 몸이 이물질로 보고 파괴하지 않도록 염기를 바꿔야 했어요.", "mRNA를 세포 안으로 안전하게 넣으려고 지질 나노 입자라는 포장을 만들었어요."], "do": ["세 가지 혁신을 ‘문제 → 해결’ 형태로 한 줄씩 정리한다.", "이 중 가장 궁금한 한 가지를 골라 질문 노트에 적는다."], "extra": false}, {"icon": "chat", "title": "임상시험은 어떻게 이루어져요?", "sub": "책이 소개하는 임상시험 설계", "book": "책은 한 mRNA 백신의 다국적 2/3상 임상시험을 소개합니다. 플라시보 대조, 관찰자 맹검, 무작위 배정으로 유효성과 안전성을 평가했습니다. 16세 이상 참가자를 1:1로 나눠 21일 간격으로 백신 또는 식염수 위약을 2회 접종했고, 두 번째 접종 7일 후부터 확인된 코로나19를 세었습니다. 사전에 감염되지 않은 36,523명 중 백신군 8명, 위약군 162명이 발병해 95%의 효능을 보였다고 합니다.", "mind": "임상시험은 비교 집단을 두고 정해진 방식으로 확인한다.", "say": ["백신을 맞은 그룹과 식염수를 맞은 그룹을 나눠서 비교했어요.", "36,523명 중 백신 그룹은 8명, 위약 그룹은 162명이 걸렸다고 책은 전해요."], "do": ["‘왜 위약 그룹이 필요한가’를 내 말로 써 본다.", "8명과 162명이라는 숫자가 무엇을 비교하는지 설명해 본다.", "더 궁금한 용어(맹검, 무작위 등)는 선생님께 질문한다."], "extra": false}, {"icon": "target", "title": "백신이 있는데 왜 모든 병을 못 막아요?", "sub": "백신의 한계 정확히 알기", "book": "책은 백신이 모든 질병을 막을 수는 없다고 분명히 말합니다. 독감 백신이 한 계절에만 효과를 나타내는 것은 독감바이러스가 매우 빠르게 돌연변이를 일으키기 때문이고, 흔한 감기를 일으키는 서로 다른 많은 바이러스를 한꺼번에 막을 백신은 불가능해 보인다고 합니다. 사백신도 표면 항원이 돌연변이하면 면역 활성이 떨어질 수 있습니다.", "mind": "나는 한계를 아는 것이 신뢰의 시작이라고 본다.", "say": ["백신이 만능이 아니라는 건 책도 분명히 말해요.", "독감 바이러스는 변이가 빨라서 한 계절만 효과가 있다고 해요."], "do": ["백신이 잘하는 일과 못하는 일을 나눠서 적는다.", "변이가 빠른 독감을 예로 한계의 이유를 설명해 본다.", "확인되지 않은 효과를 부풀리지 않는다."], "extra": false}, {"icon": "bolt", "title": "새로운 바이러스는 왜 계속 나와요?", "sub": "코로나바이러스 이해하기", "book": "책은 박쥐의 전형적인 바이러스인 코로나 발견을 사람들에게 잘 전하는 일도 과학의 일부다.", "say": ["과학은 연구실에서 끝나지 않고 사람들에게 전해져야 힘을 가져요."], "do": ["오늘 배운 내용을 친구나 가족에게 쉽게 설명해 보고 반응을 적는다.", "과학을 글, 영상, 강연으로 알리는 일에 관심이 있는지 진로 노트에 적는다."], "extra": true}, {"icon": "target", "title": "진로 · 어떤 공부가 바탕이 될까", "sub": "책에 나오는 학문들", "book": "책에 나오는 인물들의 길에는 여러 학문이 등장합니다. 대학 시절 연구자가 기억하는 강의는 유전학, 유기화학, 수학, 미생물학이었습니다. mRNA 백신은 mRNA에 대한 기초 연구, 질병과 면역을 둘러싼 세포학, 분자생물학, 생리학 연구, 그리고 그 결과를 임상에 응용하는 연구가 모인 성과라고 책은 소개합니다. 지질 나노 입자 같은 전달 기술도 중요했습니다.", "mind": "하나의 성과에는 여러 학문의 공부가 함께 들어 있다.", "say": ["백신은 생물, 화학, 수학, 의학이 함께 만든 결과예요."], "do": ["지금 학교에서 배우는 과목과 책에 나온 학문을 선으로 연결해 본다.", "가장 재미있는 과목과 어려운 과목을 적고 이유를 비교한다."], "extra": true}, {"icon": "sprout", "title": "진로 · 하고 싶은 일이 계속 거절당할 때", "sub": "끝까지 가는 사람의 방식", "book": "책은 mRNA를 치료제로 쓰겠다는 생각이 당시에는 너무 급진적이어서 한 연구자가 연구비를 거듭 거절당했다고 전합니다. 신청한 일곱 건 중 그 연구자의 것만 승인되지 않은 적도 있고, 연구를 계속하려면 낮은 급료의 임시 연구원 자리를 받아들여야 하는 선택도 했습니다. 그럼에도 좌절보다 투지를 불태웠고, 십여 년의 끈질긴 실험 끝에 변형 mRNA로 결과를 얻었다고 합니다.", "mind": "나는 지금의 거절을 이 일의 끝이라고 단정하지 않는다.", "say": ["지금 결과가 나오지 않아도 연구는 작은 발자국이 이어져 큰 성과가 된다고 책은 말해요."], "do": ["거절 이유를 적고, 바꿀 것과 지킬 것을 나눈다.", "내 일에 관심을 가질 협력자를 찾는다. 책 속 협업도 복사기 앞의 짧은 대화에서 시작되었다.", "결과가 나오기 전까지 단계별 작은 목표를 정한다."], "extra": false}, {"icon": "users", "title": "진로 · 혼자 할 수 없는 일, 협력과 다양성", "sub": "여러 사람의 일이 이어진 결과", "book": "책은 mRNA 백신이 수십 년 동안 세계 여러 곳의 수많은 연구자가 쌓아 올린 성과의 집약이라고 봅니다. 기초 연구, 스파이크 단백질 구조 규명, 임상시험 총괄, 제조 책임자의 기여를 짚고, 성별이나 국적과 상관없이 과학 활동이 차별 없이 민주적으로 이루어질 때 기여가 최대가 된다고 말합니다. 이는 책의 관점입니다.", "mind": "나는 한 사람의 영웅담보다 쌓여 온 과정을 본다.", "say": ["백신은 기초 연구, 구조 규명, 임상, 제조까지 여러 사람의 일이 이어진 결과라고 책은 말해요."], "do": ["이야기 속 인물 둘을 골라 서로 어떤 점에서 도왔는지 적는다.", "다른 사람의 기여를 먼저 언급하는 연습을 한다.", "평가가 갈릴 수 있는 이야기는 책의 관점임을 밝히고 말한다."], "extra": false}, {"icon": "flag", "title": "진로 · 나의 진로를 정리하는 질문", "sub": "책 밖의 일반적인 탐색 질문", "book": "이 책은 진로를 직접 안내하는 책이 아닙니다. 인물 이야기에서 끌리는 점을 찾아 진로를 생각해 보도록 구성했고, 이 카드의 질문은 책 밖의 일반적인 탐색 질문입니다. 정답은 없으며 생각이 바뀌어도 괜찮습니다.", "mind": "끌리는 이유를 적어 두면 나의 기준이 보인다.", "say": [], "do": ["인물 이야기 중 가장 마음에 남은 장면과 이유를 적는다.", "그 인물이 한 일 중 내가 해 보고 싶은 일은 무엇인지 적는다.", "더 알고 싶은 질문 세 가지를 진로 노트에 적고 선생님이나 보호자와 이야기해 본다.", "생각이 바뀔 때마다 노트에 날짜와 함께 덧붙인다."], "extra": true}], "myths": [{"title": "‘mRNA 백신은 완전히 새로운 기술이라 검증이 부족하다’", "body": "책은 이 개념이 전혀 새로운 것이 아니라고 설명합니다. 금세 성공할 것 같았던 개념이 증명되기까지는 40년의 고난이 필요했고, 그동안 유명·무명의 많은 과학자가 기초와 응용 부문에서 쌓은 연구 결과가 팬데믹 비상 시국에 결집해 백신 개발의 밑바탕이 되었다고 봅니다. 과학계에 ‘하룻밤 자고 나니 유명해졌다’는 식의 성공은 드물고, 이 백신도 수십 년간 작은 발자국이 이어진 결과입니다.", "ask": "내가 ‘새롭다’고 느낀 것은 기술인가, 내가 처음 들은 것인가?"}, {"title": "‘mRNA 백신이 내 DNA를 바꾼다’", "body": "책은 DNA를 핵 속의 원본, mRNA를 세포질로 보내는 복사본으로 설명합니다. mRNA 백신은 DNA 백신과 달리 유전물질이 핵으로 들어가지 않기 때문에 숙주의 유전체에 통합될 위험이 없다고 책은 봅니다. 또 mRNA는 세포 밖에서 이미 만들어져 세포질에 도착하자마자 단백질 번역을 시작합니다.", "ask": "내가 걱정하는 것은 DNA인가, mRNA인가?"}, {"title": "‘빨리 만든 백신은 허술하다’", "body": "책이 전하는 속도는 설계 단계의 속도입니다. 염기서열이 공개되고 이틀 만에 백신 후보가 설계되었고, 66일 만에 임상시험에 들어갔으며, 후보의 염기서열을 정한 지 37일 만에 마우스에서 면역반응을 확인했습니다. 그 뒤 임상시험은 단계를 거쳤습니다. 한 mRNA 백신의 2/3상 임상시험에는 36,523명의 참가자가 있었고, 책은 이를 바탕으로 95%의 백신 효능을 소개합니다. 책은 보통 10~15년이 걸리는 백신을 몇 달 안에 만들기 위해 700여 명 규모의 팀이 움직였다고도 전합니다.", "ask": "‘빠름’의 어느 부분이 빨라졌는지 나눠 보았는가?"}, {"title": "‘백신을 맞으면 병을 일으키는 바이러스가 몸에 들어온다’", "body": "책에 따르면 mRNA 백신은 질병의 원인 바이러스를 넣는 것이 아니라 항원 단백질을 만들도록 지시하는 유전정보를 넣는 백신이어서 안전하다고 봅니다. 반면 약독화 생백신은 증식 과정이 복잡하고 면역체계가 손상된 사람에게는 부적합하며 매우 드물게 질병을 유발할 수 있다고 책은 말합니다. 사백신은 열이나 화학물질로 유전물질을 파괴해 감염과 복제 능력이 없어 질병을 유발할 위험이 없다고 합니다.", "ask": "이 백신은 병원체를 넣는가, 설계도를 넣는가?"}, {"title": "‘백신이 있으면 모든 병을 막을 수 있다’", "body": "책은 백신이 모든 질병을 막을 수는 없다고 분명히 말합니다. 독감 백신이 한 계절에만 효과를 나타내는 것은 독감바이러스가 매우 빠르게 돌연변이를 일으키기 때문이고, 흔한 감기를 일으키는 서로 다른 많은 바이러스를 한꺼번에 막을 백신은 불가능해 보인다고 합니다. 백신은 위험한 감염병을 막고 많은 목숨을 살리는 데 공헌했지만, 그 효과에는 대상과 한계가 있습니다.", "ask": "이 백신이 막는 대상은 정확히 무엇인가?"}, {"title": "‘mRNA를 몸에 넣기만 하면 바로 약이 된다’", "body": "책은 이것이 쉬운 일이 아니었다고 전합니다. 연구자가 mRNA를 만들어 마우스에 주사하자 마우스는 식욕을 잃고 털 색깔이 변하는 등 병에 걸렸습니다. 넣은 mRNA가 이물질로 간주되어 비특이적 면역반응을 일으키며 파괴되었기 때문입니다. 해법은 우리딘 염기를 변형된 1-메틸슈도우리딘으로 바꾼 mRNA였고, 이 mRNA는 염증반응 없이 변형되지 않은 mRNA보다 단백질을 더 잘 만들었다고 책은 소개합니다.", "ask": "넣는 일과 몸이 받아들이는 일은 같은 문제인가?"}, {"title": "‘면역은 항체만 있으면 된다’", "body": "책은 항체가 원형질막을 쉽게 통과할 수 없는 커다란 단백질이라 주로 세포 바깥에서 효과를 나타낸다고 설명합니다. 그래서 항체에 의한 체액성반응은 혈액, 림프, 간질액 속의 병원체와 독소에 효과적이지만, 병원체가 세포 안에 있을 때는 항체의 공격을 받지 않습니다. 이 경우에는 세포성 면역반응이 작동해야 합니다.", "ask": "병원체가 세포 안에 있는가, 밖에 있는가?"}, {"title": "‘열은 무조건 나쁜 증상이다’", "body": "책은 감염 상황의 열을 면역 작용의 일부로 설명합니다. 일부 면역세포가 분비하는 인터루킨이 체온을 높게 유지하고, 체온이 오르면 성장에 필요한 철 성분이 혈액 속에서 줄어 세균과 곰팡이의 증식이 저해되며 식세포는 더 활발해집니다. 한편 사이토카인이 과다하게 분비되어 정상 세포를 공격하는 사이토카인 폭풍은 심하면 목숨을 빼앗기도 합니다. 반응에는 켜는 것과 끄는 것이 모두 필요합니다.", "ask": "이 반응은 방어의 일부인가, 지나친 반응인가?"}, {"title": "‘mRNA 백신의 성공은 몇몇 유명인의 공이다’", "body": "책은 이 백신이 mRNA 기초 연구, 질병과 면역에 관한 세포학·분자생물학·생리학 연구, 그 결과를 임상에 응용하는 연구 등 수십 년 동안 수많은 연구자가 헌신적으로 쌓은 결과물이라고 봅니다. 또 mRNA 변형, 스파이크 단백질의 구조 안정화, 지질 나노 입자라는 세 줄기의 혁신이 크게 기여했다고 정리합니다.", "ask": "내가 아는 ‘공로자’ 말고 또 누구의 일이 이어졌는가?"}, {"title": "‘DNA와 RNA는 이름만 다른 같은 물질이다’", "body": "책은 둘 다 핵산이라는 고분자이고 당, 인산, 염기로 된 뉴클레오티드를 단위로 하지만 다르다고 설명합니다. 당은 RNA가 리보오스, DNA가 산소가 하나 적은 디옥시리보오스이고, 염기는 DNA의 T가 RNA에서는 U로 바뀝니다. RNA는 단일가닥, DNA는 이중가닥의 이중 나선이라 더 안정하며, DNA가 길고 RNA는 비교적 짧습니다.", "ask": "두 분자의 차이를 네 가지로 말할 수 있는가?"}, {"title": "‘피부와 점막은 병원체를 골라서 막는다’", "body": "책은 피부, 점막에서 분비되는 점액과 눈물 속 효소, 강한 위산, 피부와 점막의 공생 미생물이 이루는 첫 번째 방어선이 효율적이라고 설명합니다. 다만 이 방어선은 몸에 해로운 것과 그렇지 않은 것을 가리지 않고 모든 침입자를 막기 때문에 무차별적입니다. 이 방어선이 뚫리면 선천성 면역반응이라는 두 번째 방어선이 작동합니다.", "ask": "이 방어는 골라서 막는가, 모두 막는가?"}], "gains": [{"title": "빠른 개발과 대응", "body": "책은 핵산에 기반한 백신이 기존 백신보다 개발 기간이 짧다는 점을 큰 장점으로 꼽습니다. 새로운 전염병이 세계적인 교통망을 통해 순식간에 퍼지는 시대에는 접종할 백신을 빠른 시간 안에 많이 확보하는 것이 공중보건에서 무엇보다 중요하고, 생산 기간이 짧은 핵산 백신이 이 요구에 맞는다고 설명합니다.", "line": "새 감염병 소식에도, 대응이 빨라질 수 있다는 근거를 알고 차분히 기다린다."}, {"title": "간단한 제조", "body": "책은 mRNA 백신을 제조할 때는 세포가 필요 없어 공정이 더 간단하고 신속하다고 설명합니다. mRNA를 만드는 과정은 염기서열만 바꾸면 되기 때문에, 완전히 새롭게 정제해야 하는 단백질 방식보다 훨씬 저렴하게 제조할 수 있고 응용하기 쉽다고 봅니다.", "line": "왜 그렇게 빨리 만들 수 있었는지, 한 문장으로 답할 수 있다."}, {"title": "변이에 맞춰 바꾸기 쉬움", "body": "책은 mRNA 백신이 유전암호만 바꾸어 쉽게 합성할 수 있기 때문에 병원체가 빨리 변이하는 위급한 상황에서 사용하기 유리하다고 설명합니다. 독감처럼 변이가 빠른 병원체 앞에서 백신의 한계를 아는 사람에게 이 점은 의미가 있습니다.", "line": "변이 소식을 들어도 ‘설계도를 바꾼다’는 원리를 떠올린다."}, {"title": "안전성 측면의 장점", "body": "책은 mRNA 백신이 질병의 원인 바이러스를 넣는 것이 아니고, 유전물질이 핵으로 들어가지 않아 숙주의 유전체에 통합될 위험이 없다고 설명합니다. 또 단백질이 만들어진 뒤의 변형 과정이 체내에서 일어나므로 단백질 소단위체나 펩티드를 직접 넣을 때 나타날 수 있는 알레르기 반응이나 면역 능력의 저하를 사전에 차단할 수 있다고 봅니다. 단점으로는 저온 수송이 필요하다는 점을 함께 짚습니다.", "line": "장점과 단점을 함께 말하는 사람이 더 믿을 만하다는 것을 안다."}, {"title": "원하는 단백질을 만들라는 지시", "body": "책은 mRNA가 세포에게 무엇을 하라고 지시하는 분자이므로 그 메시지를 바꾸면 원하는 것을 세포가 만들게 할 수 있다고 소개합니다. 예를 들면 당뇨병이 있는 사람의 세포가 인슐린을 만들게 할 수 있고, 영구적이지는 않지만 즉시 만들 수 있다고 합니다. 단백질 백신을 암호화한 mRNA를 전달하면 세포는 작은 백신 공장이 됩니다.", "line": "mRNA를 ‘세포에게 보내는 지시서’로 쉽게 설명할 수 있다."}, {"title": "백신 너머의 미래", "body": "책은 백신에 쓰이는 mRNA 치료제가 앞으로 백신뿐 아니라 암 같은 질병을 예방하거나 치료하는 데도 더욱 효과적으로 활용될 수 있을 것이라고 전망합니다. 이는 책의 전망이며 확정된 결과가 아닙니다.", "line": "미래의 가능성과 이미 확인된 사실을 구분해서 이야기한다."}, {"title": "스스로 만드는 면역", "body": "책은 백신에 의한 면역이 우리 몸이 스스로 면역반응을 일으켜 병원체를 퇴치하도록 하는 능동 면역반응이며, 일단 활성화되면 오랜 기간, 때로는 평생 지속되기도 한다고 설명합니다. 면역을 기억하는 몸의 능력이 백신이 작용하는 바탕입니다.", "line": "백신은 몸이 기억하는 힘을 빌리는 일이라고 이해한다."}, {"title": "뉴스를 이해하는 눈", "body": "책은 mRNA 백신이라는 용어는 흔히 쓰지만 정작 무엇이냐고 물으면 대부분 말문이 막힌다는 데서 시작합니다. DNA, mRNA, 단백질의 관계와 백신의 원리를 알면 소식을 스스로 이해하고 판단하는 데 도움이 됩니다.", "line": "뉴스를 보며 ‘이건 어느 단계의 이야기인지’ 짚어 볼 수 있다."}, {"title": "차별 없는 과학이 주는 것", "body": "책은 성별이나 국적, 출신과 상관없이 과학자들이 만든 연구 결과가 많은 사람의 생명을 구했다는 사실에서, 과학 활동이 차별 없이 민주적으로 이루어질 때 최대한으로 기여할 수 있다고 봅니다. 성실하게 진리를 추구하고 지식을 공유하려는 과학자의 모습이 한때 불신의 대상이었던 과학을 새롭게 바라보게 한다고도 말합니다.", "line": "배경이 다른 사람의 지식에도 귀를 기울이는 사람이 된다."}], "rules": [{"title": "DNA와 RNA의 같은 점과 다른 점", "body": "둘 다 ‘핵산’이라는 고분자이며, 당·인산·염기로 이루어진 뉴클레오티드를 단위로 합니다. 다른 점은 네 가지입니다. 첫째 당: RNA는 리보오스, DNA는 산소가 하나 적은 디옥시리보오스를 갖고, 이름의 첫 글자가 여기서 나옵니다. 둘째 염기: DNA는 A·C·G·T, RNA는 A·C·G·U를 씁니다. 셋째 가닥: RNA는 단일가닥, DNA는 마주 보는 이중가닥의 이중 나선이라 더 안정합니다. 넷째 길이: DNA가 길고 RNA는 비교적 짧습니다."}, {"title": "유전정보와 유전자", "body": "뉴클레오티드 사슬 안의 염기 순서, 즉 염기서열이 유전정보가 됩니다. 단백질을 만들 수 있는 유전정보의 단위를 유전자라고 부릅니다. 이 개념이 mRNA 백신을 이해하는 출발점입니다. 백신 설계는 결국 ‘어떤 단백질을 만들게 할 것인가’를 염기서열로 쓰는 일이기 때문입니다."}, {"title": "생물학의 중심 원리: DNA → RNA → 단백질", "body": "유전정보는 아주 소중하므로 보통 세포의 핵 안에 안정한 DNA라는 원본으로 있습니다. 그런데 단백질을 통한 세포의 작용은 핵 바깥 세포질에서 일어납니다. 그래서 DNA는 자신의 유전정보를 품은 복사본 RNA(mRNA)를 만들어 세포질로 보냅니다(전사). 리보솜이라는 단백질 합성 기구는 이 mRNA를 바탕으로 단백질을 만듭니다(번역). 모든 생물에서 일어나는 이 흐름을 중심 원리(central dogma)라고 합니다."}, {"title": "바이러스와 항원", "body": "바이러스는 단백질 껍질로 둘러싸인 DNA나 RNA를 유전물질로 갖는 기생체입니다. 몸에 들어오면 어떤 종류든 유전물질이 숙주세포가 인식할 수 있는 mRNA 형태로 바뀌어 자신의 단백질을 만들게 합니다. 인체는 이 단백질을 항원으로 인식해 항체를 만들어 맞서거나, 기억세포를 만들어 다음에 같은 바이러스가 들어올 때를 대비합니다. 바이러스는 세포의 기구를 탈취해 자신을 복제하고, 어떤 경우에는 자신의 DNA를 숙주의 DNA에 삽입하기도 합니다."}, {"title": "면역계는 왜 필요한가", "body": "생물체 주변에는 바이러스, 박테리아, 원생동물, 균류처럼 다른 생물체에 침범해 필요한 것을 얻으려는 침입자가 득실댑니다. 바이러스는 세포의 기구를 탈취해 자신을 복제하고, 어떤 경우에는 자신의 DNA를 숙주의 DNA에 삽입해 번식에 무임승차하기도 합니다. 생물체가 살아남아 번성하는 것은 이런 침입자에 대항하는 면역계를 다양하게 진화·적응시켜 왔기 때문입니다. 면역계는 침입자를 물리치는 데 그치지 않고, 한 번 침입을 당한 뒤에는 다음 침입에 대비하는 방법까지 갖추도록 진화했습니다. 책은 무척추동물과 다른 척추동물도 비슷한 면역계를 어느 정도 갖췄다는 증거가 나오고 있다고 하면서, 주로 포유류의 면역계를 다룹니다."}, {"title": "면역의 첫 번째 방어선", "body": "피부는 침입자의 효소가 쉽게 분해하지 못하는 케라틴 단백질로 되어 있어 손상되지 않는 한 물리적 장벽이 됩니다. 피부가 덮지 못하는 소화·호흡·생식기관의 통로는 ‘관 속의 관’ 구조로 침입자를 특정 구조 안에 붙잡아 둡니다. 호흡기관은 점액으로 미생물을 붙잡고 섬모운동으로 쓸어내며, 위의 강한 산성 위산은 대부분의 생물을 죽입니다. 눈물의 리소자임은 일부 박테리아의 세포벽 결합을 끊습니다. 큰창자의 대장균, 질의 젖산균 같은 공생 미생물은 침입자의 경쟁자가 됩니다."}, {"title": "면역의 두 번째 방어선: 선천성 면역", "body": "첫 번째 방어선이 뚫리면 선천성(비특이적) 면역반응이 매우 신속하게 작동하며 바이러스, 세균, 균류, 원생생물, 기생충, 독소 등 광범위한 대상을 인식합니다. 식세포는 침입한 병원체나 감염된 세포를 삼켜 파괴하고, 최전방의 병사처럼 싸우다 죽은 식세포는 고름을 이룹니다. 상처 부위에 혈장이 모이면 독소가 희석되고 항균 물질이 운반되며, 혈류가 늘어 열이 나고 붉어집니다. 신호 물질이 방출되면 염증반응과 발열이 일어납니다."}, {"title": "열과 사이토카인 폭풍", "body": "열은 감염으로 백혈구가 늘 때 일부 세포가 분비하는 인터루킨이 체온을 높게 유지하면서 생깁니다. 체온이 오르면 혈액 속에서 성장에 필수적인 철 성분이 줄어 박테리아나 곰팡이의 증식이 저해되고, 식세포가 병원체를 더 활발하게 공격합니다. 반면 사이토카인이 과다하게 분비되어 정상 세포를 공격하는 과잉 염증반응이 사이토카인 폭풍이며, 심하면 환자의 목숨을 빼앗기도 합니다."}, {"title": "세 번째 방어선: 항체와 세포성 면역", "body": "적응 면역은 병원체에 맞게 반응하는 방어입니다. 항체는 쉽게 원형질막을 통과할 수 없는 커다란 단백질이라 주로 세포 바깥에서 효과를 나타냅니다. 항체에 의한 체액성반응은 혈액, 림프, 간질액 속의 병원체와 독소에 효과적이며, 병원체가 세포 안에 있을 때는 세포성 면역반응이 작동해야 합니다. 몸은 수백만 종류가 넘는 B세포와 T세포를 갖고 있어 침입하는 대부분의 항원을 인식하고 결합할 수 있습니다."}, {"title": "클론선택: 시간이 걸리는 이유", "body": "특정 침입자를 알아보는 면역세포는 수가 적어 처음에는 침입자를 모두 죽이지 못합니다. 기성복 매장에 같은 체형의 옷을 찾는 손님이 몰려 일시적으로 품절이 되는 것과 같습니다. 그래서 반응하는 세포가 클론선택으로 늘어나야 하는데 이 과정은 보통 1~2주가 걸립니다. 그 사이 필요한 세포가 병원체보다 늦게 늘면 환자는 중증 질환을 앓거나 사망할 수도 있습니다."}, {"title": "면역기억과 2차 면역반응", "body": "1차 면역반응으로 침입 병원체나 독소가 사라지면 B세포와 T세포 클론은 더 증식하지 않고 체액에서 사라지지만, 면역기억을 담당하는 기억 B세포와 기억 T세포는 오랫동안 불활성 상태로 남습니다. 같은 항원이 다시 들어오면 새로 만들어지는 세포가 아니라 이미 있는 기억세포가 반응을 이끌어 2차 면역반응이 1차보다 신속하고, 적은 항원으로도 더 많은 항체가 생성됩니다."}, {"title": "면역반응을 멈추는 일", "body": "병원체가 더 이상 감염을 일으키지 않을 때는 면역반응을 비활성화해야 합니다. 매우 강력한 면역반응이 건강한 조직을 손상시킬 수 있기 때문입니다. 책에 따르면 특별한 사이토카인의 조합이 면역반응을 중단시킵니다. 면역은 ‘켜는 일’만큼 ‘끄는 일’도 중요합니다."}, {"title": "백신의 원리", "body": "백신은 죽거나 약화된 바이러스, 또는 바이러스의 단백질로 숙주세포에 침입하는 바이러스를 흉내 내어 면역작용을 돕습니다. 넓게 보면 병을 일으키지 않으면서 병원체, 독소, 암세포에 대한 면역을 만들어 내는 물질입니다. 항원을 처음 주입하면 병에 걸린 것처럼 B세포와 기억세포의 생산이 촉진되는 1차 반응이 일어나는데 느리고 세포도 적게 생기므로, 기억세포가 더 많은 항체생산 세포와 기억세포를 만들도록 추가 접종을 하기도 합니다."}, {"title": "백신의 역사와 초창기 백신", "body": "백신은 1796년 영국인 의사가 처음 개발했습니다. 당시 천연두는 매년 네 사람 중 한 사람꼴로 목숨을 앗아가던 유행병이었고, 그는 우두에 자주 걸리는 소 젖 짜는 여성들이 천연두에는 거의 걸리지 않는다는 점을 관찰해 소량의 우두바이러스를 사람에게 주사했습니다. 광견병 백신을 만든 파스퇴르와 함께 초창기를 대표하며, 이때는 면역 메커니즘은커녕 병원체의 정체도 잘 몰랐지만 병원체를 약화시키거나 죽인 백신으로 천연두, 소아마비, 홍역, 볼거리, 풍진을 막는 데 성공했습니다."}, {"title": "백신의 효과와 한계", "body": "우리 대부분은 어렸을 때 홍역, 소아마비, 디프테리아 같은 전염병 백신을 여러 차례 접종받았습니다. 백신은 위험한 감염성 질환을 막고 많은 목숨을 살리는 데 공헌했습니다. 접종으로 영유아가 소아마비, 홍역, 백일해에 걸리거나 사망하는 비율이 상당히 줄었습니다. 그러나 모든 질병을 막을 수는 없습니다. 독감 백신이 한 계절에만 효과가 있는 것은 독감바이러스가 매우 빠르게 돌연변이하기 때문이고, 감기를 일으키는 서로 다른 많은 바이러스를 막을 백신 개발도 불가능해 보입니다."}, {"title": "백신의 종류 ①: 약독화 생백신과 사백신", "body": "약독화 생백신은 바이러스를 먼저 증식시켜야 하므로 제조 과정이 복잡하고 정제가 어렵고 예방 효과가 다소 떨어지며, 면역체계가 손상된 사람에게는 부적합하고 매우 드물게 질병을 유발할 수 있습니다. 사백신은 바이러스를 수정란이나 배양세포에서 키운 뒤 열이나 화학물질, 방사선으로 유전물질을 파괴해 만듭니다. 제조가 비교적 간단하고 살아 있는 성분이 없어 질병 위험이 없으며 면역계가 손상된 사람에게 적합하지만, 주로 체액성 면역에 의존해 반응이 약하므로 추가 접종이 필요하고 표면 항원이 돌연변이하면 면역 활성이 떨어질 수 있습니다."}, {"title": "백신의 종류 ②: 재조합 백신과 핵산 백신", "body": "재조합 백신은 배양세포에서 항원 단백질을 합성한 뒤 주입하는 백신으로, 안전성이 높고 보관과 취급이 유리하며 대표적으로 노바백스 백신이 있고, 책이 쓰일 당시에는 국내 제조업체와 위탁생산 계약을 맺어 공급이 쉬워질 것으로 기대되었습니다. 핵산 백신은 항원 단백질 대신 그것을 합성하는 정보를 유전암호 형태로 넣는 백신이며 개발 기간이 더 짧다는 장점이 있습니다. 핵산 백신은 DNA 백신과 mRNA 백신으로 나뉩니다. DNA 백신은 체내에서 mRNA로 전사된 뒤 단백질이 만들어지지만 임상시험에서 기대한 성공을 거두지 못했고 승인된 백신이 아직 없다고 책은 전합니다. mRNA 백신은 바로 단백질로 번역될 수 있습니다."}, {"title": "mRNA 백신이 작동하는 방식", "body": "mRNA 백신은 병원체의 항원 단백질 대신 그 단백질을 만들도록 지시하는 유전정보를 mRNA 형태로 넣습니다. DNA에서 mRNA를 만드는 과정이 이미 세포 밖에서 끝나 있으므로 세포질에 도착하자마자 단백질 번역을 시작합니다. 세포는 작은 백신 공장이 되고, 면역계는 만들어진 단백질을 인식해 대응합니다. 최초로 사용이 승인된 mRNA 백신은 모더나 백신과 화이자/바이오엔테크 백신입니다."}, {"title": "mRNA 백신의 장점과 단점", "body": "단점은 저온 수송이 필요하다는 것입니다. 장점은 다음과 같습니다. DNA 백신과 달리 유전물질이 핵으로 들어가지 않아 숙주 유전체에 통합될 위험이 없고, 병의 원인 바이러스를 넣지 않아 안전합니다. 유전암호만 바꿔 쉽게 합성하므로 병원체가 빨리 변이하는 위급한 상황에 유리하고, 제조에 세포가 필요 없어 공정이 간단하고 신속합니다. 단백질이 만들어진 뒤의 변형이 체내에서 일어나 최종 단백질이 고유한 구조적 특성을 가지므로 알레르기 반응이나 면역 능력 저하를 사전에 차단할 수 있다고 책은 봅니다."}, {"title": "풀어야 했던 세 가지 숙제", "body": "mRNA 백신이 세포 안에서 작용하게 하려면 세 가지를 해결해야 했습니다. 첫째, mRNA가 어떤 항원 단백질을 만들게 할 것인지 정하는 것. 둘째, 거부 반응을 일으키지 않는 안전한 mRNA를 만드는 것. 셋째, 그 mRNA를 인체에 넣는 방법을 고안하는 것. 이를 해결한 세 줄기의 혁신이 코로나19 mRNA 백신 개발에 크게 기여했습니다."}, {"title": "혁신 ①: mRNA 변형", "body": "mRNA를 몸에 넣으면 이물질로 간주되어 비특이적 면역반응으로 파괴됩니다. 이 문제를 풀기 위해 연구자는 mRNA를 시험관에서 전사할 때 원래의 우리딘 염기를 변형된 1-메틸슈도우리딘으로 바꾼 변형 RNA를 만들었습니다. 마우스에 주사한 결과 별다른 염증반응 없이 원하는 단백질을 만들었고, 변형 mRNA는 변형되지 않은 mRNA보다 배양세포와 마우스에서 단백질을 훨씬 더 잘 만들었습니다. 연구자는 2005년에 신체의 자연방어를 우회하게끔 mRNA를 합성하는 방법을 찾아냈고, 모더나 백신과 화이자/바이오엔테크 백신은 뉴클레오티드를 변형해 mRNA 자체에 대한 면역반응을 막는 방법을 씁니다."}, {"title": "혁신 ②: 스파이크 단백질의 구조 안정화", "body": "코로나바이러스 표면의 스파이크 단백질은 열쇠이고 사람 세포의 수용체는 자물쇠입니다. 스파이크 단백질이 수용체라는 열쇠 구멍을 열고 들어가면 감염과 바이러스 복제가 일어납니다. 모든 코로나바이러스에서 스파이크 단백질이 아주 잘 보존되어 있어 먼 공통 조상에서 진화했음을 알 수 있습니다. 연구자들은 사람 수용체와 융합하기 전의 스파이크 단백질 구조를 밝히고, 이를 안정화하는 변이를 도입해 효율적인 백신을 만드는 데 기여했습니다. 몇 년간의 연구로 정확히 디자인된 항원을 전달하는 시스템을 확보했지만, 당시에는 팬데믹에서 이 발견이 낳을 성과를 아무도 예상하지 못했습니다."}, {"title": "혁신 ③: 지질 나노 입자", "body": "mRNA가 백신으로서 완전한 효능을 발휘하려면 세포막을 가로질러 세포질로 전달되어야 합니다. 지질 나노 입자는 효소 공격으로부터 mRNA를 보호하고 세포 흡수를 촉진하는 전달 시스템입니다. 뉴클레오티드를 변형하거나 서열을 가공한 mRNA를 지질 나노 입자에 넣으면 노출된 mRNA에 비해 발현이 최대 1000배까지 향상됩니다. 초기에 mRNA 전달용으로 쓰인 입자 중 DOTAP와 DOPE를 결합한 것은 안정성이 낮고 독성을 나타냈다고 책은 전합니다."}, {"title": "코로나19 백신 개발 일정", "body": "2020년 1월 9일 세계보건기구가 코로나19 확산을 발표하고 이틀 뒤 중국 과학자들이 신종 코로나바이러스의 염기서열을 공개했습니다. 이를 바탕으로 미국국립보건원과 모더나는 다시 이틀 만에 첫 mRNA 백신 후보를 설계했고, 66일이라는 최단 기록으로 임상시험에 진입했습니다. mRNA-1273의 염기서열을 정하고 37일 만에 마우스에서 면역반응을 확인했습니다. 보통 10~15년이 걸리는 백신을 몇 달 안에 만든 것은 수십 년의 기초 연구 위에서 가능했습니다."}, {"title": "전임상 시험: 마우스와 원숭이", "body": "연구자는 백신 후보 mRNA-1273이 마우스에서 신종 코로나바이러스에 대한 면역반응을 효과적으로 일으키는지 확인했습니다. 폐와 코에서 복제할 수 있도록 마우스에 적응시킨 바이러스 주를 사용했고, 세 종류의 마우스 주에 두 차례 접종했습니다. 1차 접종 후 강력한 항체반응이 유도되었고 2차 접종 뒤 강화되었으며, 특히 1㎍을 2차 접종한 뒤 중화항체반응이 유도되었습니다. 1㎍과 10㎍을 한 차례 접종해도 강력한 중화항체반응이 유도되었습니다. 이후 인간과 보다 가까운 히말라야원숭이로 시험했습니다."}, {"title": "임상시험 설계와 결과(화이자/바이오엔테크 백신)", "body": "다국적, 2/3상, 플라시보 대조, 관찰자 맹검, 무작위 임상시험으로 BNT162b2 백신의 유효성과 안전성을 평가했습니다. 16세 이상의 건강하거나 만성질환이 있는 참가자를 1:1로 무작위 배정해 21일 간격으로 백신 또는 식염수 위약을 30㎍ 용량으로 2회 접종했습니다. 주요 평가변수는 두 번째 접종 후 최소 7일 뒤에 발병한 확인된 코로나19에 대한 백신의 효능이었습니다. 사전에 감염되지 않은 36,523명 중 코로나19는 백신접종군에서 8명, 플라시보군에서 162명 발병해 95%의 백신 효능을 보였습니다."}, {"title": "코로나바이러스가 보내는 경고", "body": "코로나바이러스는 박쥐의 전형적인 바이러스이며 사람에게 전파되면 광범위한 유행병이나 팬데믹을 일으킬 수 있습니다. 연례적으로 감기 비슷한 증상을 일으키는 유행성 코로나바이러스도 있지만, 사스(2002년, 32개국 8,437명 확진, 813명 사망)와 메르스(2012년, 27개국 2,494명 확진, 854명 사망)는 공중보건의 큰 위협이었습니다. 한 연구팀은 사스 유사 코로나바이러스가 재발할 가능성이 크다고 주장해 왔고, 신종 코로나바이러스는 인간에게 출현할 가능성이 높은 WIV1과 같은 베타 코로나바이러스 아족에 속한다고 책은 소개합니다. 책은 이런 바이러스가 퍼지는 것을 효과적으로 막으려면 백신 접종밖에 없다고 봅니다."}, {"title": "과학 성과는 작은 발자국이 쌓여 이루어진다", "body": "책은 ‘하룻밤 자고 나니 유명해졌다’는 식의 성공은 과학계에서 드물다고 말합니다. mRNA 백신은 mRNA에 대한 기초 연구, 질병과 면역을 둘러싼 세포학·분자생물학·생리학 연구, 그 결과를 임상에 응용하는 연구 등 세계 여러 곳의 수많은 연구자가 수십 년 동안 헌신적으로 쌓아 올린 성과가 집약된 결과물입니다. mRNA 백신의 경우에도 연구는 수십 년 동안 작은 발자국으로 이어져 왔습니다."}], "stories": [{"title": "백신의 시작 · 우두를 관찰한 의사", "body": "1796년 영국인 의사는 소의 젖을 짜는 여성들이 우두에는 자주 걸리면서 천연두에는 거의 걸리지 않는다는 사실을 관찰했습니다. 당시 천연두는 매년 네 사람 중 한 사람꼴로 목숨을 앗아가던 유행병이었습니다. 그는 소량의 우두바이러스를 사람에게 주사해 천연두를 막으려 했고, 이것이 백신의 시작이 되었습니다. 책은 면역 메커니즘을 모르던 시대에도 관찰에서 성과가 나왔다고 전합니다.", "line": "책이 주는 시선: 좋은 관찰은 원리를 몰라도 길을 연다. 생각해 보기: 요즘 나는 어떤 현상을 ‘왜?’ 하고 바라보는가?"}, {"title": "mRNA 연구자 ① 동물의 심장을 들여다보던 아이", "body": "책이 소개하는 mRNA 변형 연구자는 푸주한 아버지와 회계원 어머니 아래에서 자랐습니다. 아버지가 돼지를 잡을 때 동생은 질색하며 도망갔지만 이 아이는 심장과 내장을 주의 깊게 관찰했고, 이것이 생물학에 대한 깊은 관심의 계기였을 것이라고 책은 추측합니다. 좋은 선생님들이 과학의 길로 이끌었다고도 전합니다.", "line": "책이 주는 시선: 호기심은 두려움이 아닌 관찰에서 시작된다. 생각해 보기: 남들이 피하는데 나는 자꾸 들여다보게 되는 것은 무엇인가?"}, {"title": "mRNA 연구자 ② 행복했던 대학 5년", "body": "책이 소개하는 mRNA 연구자에게 대학에서 보낸 5년은 인생에서 가장 행복한 해였습니다. 이른 아침부터 늦은 저녁까지 강의와 실습에 참여했고, 여름에는 견학을 다녔습니다. 기억에 남는 강사로 유전학, 유기화학, 수학, 미생물학을 가르친 네 명을 꼽았습니다. 기숙사는 사교적인 활동이 활발했고, 한가한 시간에는 디스코를 즐겼습니다.", "line": "책이 주는 시선: 공부와 즐거움이 함께한 시간이 바탕이 되었다. 생각해 보기: 나는 어떤 수업이나 활동에서 시간이 가장 빨리 가는가?"}, {"title": "mRNA 연구자 ③ 도축장에서 구한 재료로 첫 연구를", "body": "1970년대 대학 시절, 이 연구자는 리포솜을 만들어 그 안에 DNA를 넣어 세포에 전달하는 연구팀에 합류했습니다. 당시에는 필요한 지질 성분을 상업적으로 구할 수 없어서, 도축장에서 차가운 뇌를 모아 와 연구원들이 일주일 내내 성분을 나누어 추출했습니다. 마침내 얻은 성분으로 필름 방법으로 리포솜을 만들고 플라스미드를 포유류 세포에 전달해 단백질을 만들었고, 논문으로 발표했습니다. 학부생으로서 연구자로의 첫발을 내디뎠다는 뿌듯함을 느꼈다고 합니다.", "line": "책이 주는 시선: 재료가 없으면 구하는 방법부터 만든다. 생각해 보기: 막혔을 때 나는 포기하는가, 방법을 바꾸는가?"}, {"title": "mRNA 연구자 ④ ‘멋진 분자’를 만난 스물두 살", "body": "1976년 스물두 살이던 이 연구자는 mRNA 이야기를 듣자마자 감탄했습니다. mRNA는 세포에게 무엇을 하라고 지시하는 분자이므로, 그 메시지를 바꾸면 원하는 것을 세포가 만들게 할 수 있다고 생각했습니다. 예를 들면 당뇨병이 있는 사람을 위해 세포가 인슐린을 만들게 할 수 있다는 생각이었습니다. 또 단백질 백신을 암호화한 mRNA를 세포에 전달하면 세포가 작은 백신 공장이 되지 않을까 하는 아이디어도 어렴풋이 갖게 되었습니다. 이후 1984년 PCR이 개발되고 1989년 PCR로 증폭한 DNA를 주형 삼아 mRNA를 만드는 방법이 나오면서 mRNA 기반 유전자 치료 연구를 시작할 수 있었습니다.", "line": "책이 주는 시선: 첫 아이디어는 어렴풋해도, 도구가 갖춰지면 구체화된다. 생각해 보기: 처음 듣고 ‘멋지다’고 느꼈던 개념이 있는가?"}, {"title": "mRNA 연구자 ⑤ 거절당한 연구비와 선택의 순간", "body": "책에 따르면 mRNA를 치료제로 쓰겠다는 생각은 너무 급진적이어서 그 연구자는 보조금을 한 번도 받지 못했습니다. 새 직장에서 낸 첫 신청도 1년 뒤 거부되었고 거절이 이어졌습니다. 신청한 일곱 건 중 자신의 것만 승인되지 않은 적도 있었습니다. 1995년에는 대학이 연구 주제를 바꾸어 종신재직권 직위를 유지하든지, mRNA 작업을 계속하되 임시 연구원으로 일하든지 선택하라고 압박했습니다. 당시 이 연구자는 투병 중이었고 남편은 비자 문제로 발이 묶여 있었으며, 결국 낮은 급료의 임시 연구원 직위를 받아들이고 mRNA 연구에 전념했습니다.", "line": "책이 주는 시선: 지위와 연구비가 없어도 방향을 지킨 선택이 있었다. 생각해 보기: 내가 지키고 싶은 방향은 무엇이고, 바꿀 수 있는 것은 무엇인가?"}, {"title": "mRNA 연구자 ⑥ 복사기 앞의 만남", "body": "1998년에는 논문을 온라인으로 찾을 수 없어 복사해야 했습니다. 복사기 앞에서 만난 낯선 연구자와 인사를 나누며, 이 연구자는 어떤 RNA든 만들 수 있고 mRNA를 몸에 넣어 세포가 치료제를 만들게 하는 것이 꿈이라고 말했습니다. 상대는 감염병 연구소 소속으로 DNA 백신을 계획하고 있었고, 이 아이디어에 금세 매료되어 기꺼이 돕겠다고 했습니다. 연구비에 대해서는 묻지도 않았고, 실험실도 연구비도 갖춘 입장이었지만 소탈했으며 두 사람은 대등하게 일했습니다.", "line": "책이 주는 시선: 자신의 일을 짧게 설명할 수 있는 사람에게 협력자가 생긴다. 생각해 보기: 내 관심사를 두 문장으로 설명할 수 있는가?"}, {"title": "mRNA 연구자 ⑦ 병든 마우스와 변형 염기", "body": "이 연구자는 꿈꾸던 대로 살아 있는 동물에 직접 mRNA를 넣는 실험을 하게 되었지만 결과는 기대와 달랐습니다. mRNA를 주사한 마우스는 병에 걸려 식욕을 잃고 털 색깔이 변했습니다. 넣은 mRNA는 이물질로 간주되어 비특이적 면역반응을 일으키며 파괴되었습니다. 반복된 실험 끝에 연구자는 우리딘 염기를 1-메틸슈도우리딘으로 바꾼 변형 RNA를 만들어 마우스에 주사했고, 숨을 죽이고 결과를 기다렸습니다. 마우스는 별다른 염증반응 없이 원하는 단백질을 만들었고, 변형 mRNA는 변형되지 않은 mRNA보다 단백질도 훨씬 더 잘 만들었습니다. 연구자는 흥분하지 않았는데, mRNA가 이런 결과를 낳으리라는 것을 한 번도 의심한 적이 없었기 때문이라고 합니다.", "line": "책이 주는 시선: 실패한 실험이 다음 질문의 모양을 알려 준다. 생각해 보기: 실패에서 얻은 단서를 적어 본 적이 있는가?"}, {"title": "mRNA 연구자 ⑧ 노벨상 이야기", "body": "책은 mRNA 변형 방법을 찾은 연구자에 대해 노벨상을 받을 만한 사람으로 최우선으로 꼽겠다는 한 인사의 평가와, 2020년 12월 27일 《이기적 유전자》로 유명한 한 저자가 소셜미디어에서 노벨상을 줘야 한다고 말한 일을 소개합니다. 책은 이 연구자의 발견으로 사람에게 쓰는 세계 최초의 mRNA 백신이 나왔고, 이 플랫폼에 의존하는 두 코로나19 백신이 많은 생명을 구하고 있다고 평가합니다. 이는 책이 전하는 평가입니다.", "line": "책이 주는 시선: 평가는 사람마다 다르지만 연구의 흐름은 기록으로 남는다. 생각해 보기: 인정과 상관없이 계속하고 싶은 일은 무엇인가?"}, {"title": "스파이크 구조 연구자 ① 생물학과 사회학을 함께 공부한 학생", "body": "구조 연구를 이끈 이 연구자는 대가족이 사는 지역을 멀리 떠나지 않아도 되는 대학을 선택했고, 의학보다 학문적이고 자유롭게 생각할 수 있는 생물학을 전공하면서 사회학을 복수전공했습니다. 학부에 다니는 동안 바이러스와 백신 개발에 관심이 생겨 여름마다 한 연구실에서 호흡기세포융합바이러스와 수지상세포에 대한 기본 지식을 익혔습니다.", "line": "책이 주는 시선: 일찍 익힌 기본기가 훗날의 속도가 된다. 생각해 보기: 서로 다른 두 분야를 함께 공부한다면 무엇을 고르겠는가?"}, {"title": "스파이크 구조 연구자 ② 메르스 연구가 남긴 준비", "body": "스파이크 단백질의 구조를 밝힌 미국국립보건원의 연구자는 신종 코로나바이러스를 염두에 두고 메르스 코로나바이러스를 연구한 것은 아니었습니다. 그러나 메르스 코로나바이러스 백신 개발에 대한 충분한 사전 지식이 있었기에 코로나19에 신속하게 백신으로 대응할 수 있었습니다. 몇 년간 연구팀은 스파이크 단백질의 구조와 효능을 밝혔고, 정확히 디자인된 항원을 전달하는 시스템을 확보했습니다. 이 연구자는 백신 회의론자와 소외계층에게 백신 접종의 중요성을 알리는 일에도 열성적이었다고 책은 전합니다.", "line": "책이 주는 시선: 다른 목적으로 쌓은 준비가 예상 못 한 날에 쓰인다. 생각해 보기: 지금 배우는 것이 훗날 어떤 문제에 쓰일 수 있을까?"}, {"title": "스파이크 구조 연구자 ③ 37일 만의 마우스 실험", "body": "mRNA-1273의 염기서열을 정한 지 37일 만에 이 연구자는 백신이 마우스에서 면역반응을 일으킬 수 있음을 확인했습니다. 노스캐롤라이나 대학교 연구팀과 협력해 마우스에 적응시킨 신종 코로나바이러스 주로 전임상 시험을 진행했고, 모더나로부터 백신을 받자마자 세 종류의 마우스 주에 두 차례 접종했습니다. 1㎍을 2차 접종한 뒤 중화항체반응이 유도되었고, 이 용량이 접종에 적당해 보였습니다. 이어 인간과 가까운 히말라야원숭이로 시험했습니다.", "line": "책이 주는 시선: 속도는 준비된 협력 체계와 함께 나온다. 생각해 보기: 팀으로 일할 때 내가 맡고 싶은 역할은 무엇인가?"}, {"title": "코로나바이러스를 처음 관찰한 연구자", "body": "책은 항체를 이용해 바이러스를 쉽게 관찰할 수 있는 ‘면역 전자현미경법’을 개발한 한 연구자를 소개합니다. 이 연구자는 코로나바이러스를 처음으로 관찰했고, 자신의 한계에도 불구하고 은퇴할 때까지 103편의 과학 논문을 저술했습니다. 책은 이런 연구자를 진정한 과학자라 부를 만하다고 평가합니다.", "line": "책이 주는 시선: 한계가 있어도 꾸준히 쌓은 기록은 사라지지 않는다. 생각해 보기: 보이지 않던 것을 보이게 하는 도구에 관심이 있는가?"}, {"title": "사스 유사 바이러스를 경고한 연구자들", "body": "미국 노스캐롤라이나 대학교의 한 연구팀은 많은 연구 결과를 근거로 사스와 비슷한 코로나바이러스가 다시 나타날 가능성이 크다고 주장해 왔습니다. 책은 코로나19를 일으킨 신종 코로나바이러스가 사스 코로나바이러스뿐 아니라 사람에게 출현할 가능성이 높은 WIV1과 같은 베타 코로나바이러스 아족에 속한다고 소개합니다. 이 연구팀은 이후 백신 후보를 마우스에서 시험하는 전임상 시험에서 협력했습니다.", "line": "책이 주는 시선: 경고는 준비로 이어질 때 의미가 생긴다. 생각해 보기: 아직 일어나지 않은 문제를 미리 연구한다면 어떤 문제를 고르겠는가?"}, {"title": "마지막 연결 고리, 임상시험과 제조", "body": "책은 백신 개발의 마지막 연결 고리인 임상시험을 총지휘한 연구자를 소개합니다. 이 연구자는 시애틀에서 최초의 코로나19 백신 1상 임상시험을 감독했고 두 백신의 3상 임상시험에도 참여했습니다. 한편 화이자 백신의 제조 개발 책임자는 보통 10~15년이 걸리는 백신을 몇 달 안에 만들기 위해 700여 명의 연구팀이 참여하는 프로젝트를 총지휘했습니다. 책은 과거에는 남성 과학자가 지배적이었지만 이제는 여성 과학자들이 백신 개발의 최전선에 서 있다고 평가합니다.", "line": "책이 주는 시선: 마지막 단계와 만드는 단계도 성과의 일부다. 생각해 보기: 발견과 실제 사용 사이에서 어떤 일에 끌리는가?"}, {"title": "함께 만든 성과 · 다양한 출신의 과학자들", "body": "책은 백신 개발에서 이민자 출신이 맡은 역할을 짚습니다. mRNA 변형 연구자는 헝가리 출신 이민자였고, 구조 연구자는 아프리카계 미국인이었으며, 제조 책임자는 동독 이민자 출신이었습니다. 모더나의 최고경영자와 공동 설립자, 임상 개발 책임자, 최고기술책임자 등도 대부분 프랑스, 캐나다, 이스라엘, 스페인, 레바논 등 외국에서 온 사람들이라고 소개합니다. 책은 일부 정치인이 스스로를 백신 개발의 공로자라고 내세운 것과 달리 기록상으로는 이민자들의 역할이 결정적이었다고 봅니다. 동시에 이들만 기여한 것은 아니며, 출신과 상관없이 과학이 차별 없이 민주적으로 이루어질 때 기여가 최대가 된다는 점이 핵심이라고 덧붙입니다. 이는 책의 관점입니다.", "line": "책이 주는 시선: 성과는 출신이 아니라 연구가 쌓인 방식으로 설명된다. 생각해 보기: 다양한 배경의 사람이 모이면 어떤 점이 달라질까?"}, {"title": "팬데믹의 한가운데에서", "body": "책이 쓰일 당시 코로나19는 전 세계에서 확진자가 2억 명, 사망자가 400만 명을 넘었고 마땅한 치료 약이 없었습니다. 사회적 거리두기, 개인위생, 격리, 봉쇄만으로는 진정시키기 어려운 상황이었습니다. 2020년 1월 9일 세계보건기구가 확산을 발표했고, 이틀 뒤 신종 코로나바이러스의 염기서열이 공개되어 백신 개발의 출발점이 되었습니다. 책은 이런 위기 속에서 성실하게 진리를 추구하고 지식을 공유하려는 과학자들의 모습이 과학에 대한 시선을 바꾸었다고 평가합니다.", "line": "책이 주는 시선: 위기에서 지식을 나누는 태도가 신뢰를 만든다. 생각해 보기: 위기 상황에서 나는 어떤 방식으로 도움이 되고 싶은가?"}]};

const day=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const subs=()=>[["myths",L.myths],["gains",L.gains],["rules",L.rules]].filter(a=>A(a[0]).length);
const tabs=()=>[["today",L.today,"sun"],A("situations").length&&["sos",L.sos,"shield"],subs().length&&["learn",L.learn,"book"],(A("stories").length||C.logEnabled)&&["story",L.story,"note"],C.help&&["help",L.help,"buoy"]].filter(Boolean);
function today(){
 const d=day(),D=A("daily"),M=A("myths"),CK=A("checklist"),ck=JSON.parse(sg("ck","[]")),m=M.length?M[d%M.length]:null;
 return (D.length?`<div class="hero"><div class="lab">${esc(L.dailyLabel)}</div><p class="stmt">${esc(D[d%D.length])}</p></div>`:"")+
 (A("situations").length?`<button class="sit" data-go="sos"><span class="i">${ic("shield")}</span><span><b>${esc(L.sos)}</b><span class="mut">${esc(L.sosCta)}</span></span></button>`:"")+
 (m?`<h2>${esc(L.truthHeading)}</h2><div class="box"><b>${esc(m.title)}</b><p>${esc(m.body)}</p></div>`:"")+
 `<h2>${esc(L.pledgeHeading)}</h2><textarea id="pl" placeholder="${esc(L.pledgePlaceholder)}">${esc(sg("pl",""))}</textarea>`+
 (CK.length?`<h2>${esc(L.checklistHeading)}</h2>`+CK.map((c,n)=>`<label class="c"><input type="checkbox" data-c="${n}" ${ck.includes(n)?"checked":""}><span>${esc(c)}</span></label>`).join("")+`<button class="back" id="rs">${esc(L.checklistReset)}</button>`:"");
}
function sos(){
 const S=A("situations");
 if(cur===null)return `<div class="hero"><div class="lab">${esc(L.sosLabel)}</div><h1>${esc(L.sosTitle)}</h1><p>${esc(L.sosText)}</p></div>`+
  S.map((s,n)=>`<button class="sit" data-n="${n}"><span class="i">${ic(s.icon)}</span><span><b>${esc(s.title)}</b><span class="mut">${esc(s.sub)}</span></span></button>`).join("")+(L.sosFooter?`<p class="mut">${esc(L.sosFooter)}</p>`:"");
 const s=S[cur],say=s.say||[],dos=s.do||[];
 return `<button class="back" id="bk">${esc(L.back)}</button><h1>${esc(s.title)}</h1>`+
 (s.book?`<h2>${esc(L.bookHeading)}</h2><div class="box">${esc(s.book)}</div>`:"")+
 (s.mind?`<h2>${esc(L.mindHeading)}</h2><div class="mind">“${esc(s.mind)}”</div>`:"")+
 (say.length?`<h2>${esc(L.sayHeading)}</h2>`+say.map(x=>`<div class="say">“${esc(x)}”</div>`).join(""):"")+
 (dos.length?`<h2>${esc(L.doHeading)}</h2>${s.extra?`<span class="tag">${esc(L.extraTag)}</span>`:""}<ul class="l">${dos.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"");
}
function myths(){return `<h1>${esc(L.mythsTitle)}</h1><p class="mut">${esc(L.mythsIntro)}</p>`+A("myths").map(m=>`<details class="my"><summary>${esc(m.title)}</summary><p>${esc(m.body)}</p>${m.ask?`<p class="mind" style="font-size:17px">${esc(L.askPrefix)}${esc(m.ask)}</p>`:""}</details>`).join("")}
function gains(){return `<h1>${esc(L.gainsTitle)}</h1><p class="mut">${esc(L.gainsIntro)}</p>`+A("gains").map(g=>`<div class="box"><b>${esc(g.title)}</b><p>${esc(g.body)}</p>${g.line?`<div class="mind" style="font-size:16px;margin:0">“${esc(g.line)}”</div>`:""}</div>`).join("")}
function rules(){return `<h1>${esc(L.rulesTitle)}</h1><p class="mut">${esc(L.rulesIntro)}</p>`+A("rules").map((p,n)=>`<div class="pr"><b>${n+1}. ${esc(p.title)}</b>${esc(p.body)}</div>`).join("")}
function learn(){
 const S=subs();if(!S.some(a=>a[0]===sub))sub=S[0][0];
 return (S.length>1?`<div class="seg">`+S.map(a=>`<button data-s="${a[0]}" aria-pressed="${sub===a[0]}">${esc(a[1])}</button>`).join("")+`</div>`:"")+{myths,gains,rules}[sub]();
}
function story(){
 const log=JSON.parse(sg("log","[]")),E=A("stories");
 return (E.length?`<h1>${esc(L.storyTitle)}</h1><p class="mut">${esc(L.storyIntro)}</p>`+E.map(e=>`<details class="my"><summary>${esc(e.title)}</summary><p>${esc(e.body)}</p>${e.line?`<p class="mind" style="font-size:17px">${esc(e.line)}</p>`:""}</details>`).join(""):"")+
 (C.logEnabled?`<h2>${esc(L.logTitle)}</h2><p class="mut">${esc(L.logIntro)}</p>
 <textarea id="ex" placeholder="${esc(L.logPlaceholder)}"></textarea>
 <button class="sit" id="ad" style="justify-content:center;margin-top:8px"><b>${esc(L.logAdd)}</b></button>`+
 log.map((l,n)=>`<div class="box"><span class="mut">${esc(l.d)}</span><p>${esc(l.t)}</p><button class="back" data-del="${n}">${esc(L.logDelete)}</button></div>`).join("")+
 (log.length?`<button class="back" id="cp">${esc(L.logCopy)}</button>`:"")+`<p class="mut">${esc(L.logNote)}</p>`:"");
}
function help(){
 const H=C.help||{};
 return `<h1>${esc(L.helpTitle)}</h1>`+(H.disclaimer?`<div class="warn"><b>${esc(H.disclaimer)}</b></div>`:"")+
 ((H.signals||[]).length?`<h2>${esc(H.signalsTitle||"")}</h2><ul class="l">${H.signals.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"")+
 ((H.contacts||[]).length?`<h2>${esc(H.contactsTitle||"")}</h2>`+H.contacts.map(c=>`<div class="box">${esc(c.label)} ${c.tel?`<a href="tel:${esc(c.tel)}">${esc(c.value)}</a>`:esc(c.value)}${c.note?`<br><span class="mut">${esc(c.note)}</span>`:""}</div>`).join(""):"")+
 (H.closing?`<p class="mut">${esc(H.closing)}</p>`:"");
}
function go(t){tab=t;cur=null;render();scrollTo(0,0)}
function render(){
 if(!tabs().some(a=>a[0]===tab))tab="today";
 app.innerHTML={today,sos,learn,story,help}[tab]();
 nav.innerHTML=tabs().map(a=>`<button data-t="${a[0]}" aria-current="${tab===a[0]}">${ic(a[2],22)}<span>${esc(a[1])}</span></button>`).join("");
 const q=(s,f)=>app.querySelectorAll(s).forEach(f);
 const bk=document.getElementById("bk");if(bk)bk.onclick=()=>{cur=null;render();scrollTo(0,0)};
 q(".sit[data-n]",b=>b.onclick=()=>{cur=+b.dataset.n;render();scrollTo(0,0)});
 q("[data-go]",b=>b.onclick=()=>go(b.dataset.go));
 nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.t));
 q("[data-s]",b=>b.onclick=()=>{sub=b.dataset.s;render()});
 const pl=document.getElementById("pl");if(pl)pl.oninput=()=>ss("pl",pl.value);
 q("input[data-c]",i=>i.onchange=()=>{ss("ck",JSON.stringify([...app.querySelectorAll("input[data-c]")].filter(x=>x.checked).map(x=>+x.dataset.c)))});
 const rs=document.getElementById("rs");if(rs)rs.onclick=()=>{ss("ck","[]");render()};
 const ad=document.getElementById("ad");if(ad)ad.onclick=()=>{const v=document.getElementById("ex").value.trim();if(!v)return;const l=JSON.parse(sg("log","[]"));l.unshift({d:new Date().toLocaleDateString(document.documentElement.lang||"ko"),t:v});ss("log",JSON.stringify(l));render()};
 q("[data-del]",b=>b.onclick=()=>{const l=JSON.parse(sg("log","[]"));l.splice(+b.dataset.del,1);ss("log",JSON.stringify(l));render()});
 const cp=document.getElementById("cp");if(cp)cp.onclick=()=>{const l=JSON.parse(sg("log","[]"));try{navigator.clipboard.writeText(l.map(x=>x.d+"\n"+x.t).join("\n\n")).then(()=>{cp.textContent=L.logCopied})}catch(e){}};
}
render();
// 서비스 워커 등록 (오프라인 사용). https 또는 localhost에서만 동작합니다.
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
